<!-- login.html -->

<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sign In | IndiraHub</title>

    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<nav class="nav">

    <a class="brand" href="product.html">
        ✦ IndiraHub
    </a>

</nav>


<main class="form">

    <p class="section-label">
        ✦ WELCOME, READER ✦
    </p>

    <h1>
        Enter the Library
    </h1>

    <p>
        Sign in to explore magical stories
        and manage your book collection.
    </p>


    <form id="loginForm">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <br>

        <button class="button" type="submit">
            Enter the Library
        </button>

    </form>


    <p id="message"></p>


    <p>
        New to IndiraHub?

        <a href="register.html">
            Create an account
        </a>
    </p>

</main>


<script>

// ==========================================
// SUPABASE CONNECTION
// ==========================================

const supabaseClient = supabase.createClient(
    "YOUR_SUPABASE_PROJECT_URL",
    "YOUR_SUPABASE_PUBLISHABLE_KEY"
);


// ==========================================
// LOGIN
// ==========================================

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");


        // ======================================
        // ADMIN LOGIN
        // ======================================

        if (
            email === "admin@indirahub.com" &&
            password === "admin123"
        ) {

            window.location.href = "admin.html";

            return;
        }


        // ======================================
        // CUSTOMER LOGIN USING SUPABASE
        // ======================================

        message.textContent = "Signing in...";


        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });


        // ======================================
        // LOGIN ERROR
        // ======================================

        if (error) {

            message.textContent =
                error.message;

            return;
        }


        // ======================================
        // LOGIN SUCCESS
        // ======================================

        message.textContent =
            "Login successful!";


        // Save logged-in user information locally
        if (data.user) {

            localStorage.setItem(
                "indirahubUser",
                JSON.stringify({
                    id: data.user.id,
                    email: data.user.email
                })
            );

        }


        // Go to bookstore
        window.location.href = "product.html";

    });

</script>

</body>
</html>
